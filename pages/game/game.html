<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Matatena Game</title>
  <link rel="stylesheet" href="../../general.css">
  <link rel="stylesheet" href="game.css">
  <link rel="stylesheet" href="../../components/dice.css">
  <link rel="stylesheet" href="../../components/my-button.css">
</head>

<body class="game-body">

  <!-- Left Side Panel (Player 1 Controls & Card) -->
  <aside class="side-panel p1-side">
    <div class="player-card-box">
      <h2 class="player-title" id="p1-title">JUGADOR 1</h2>
      <div class="dice-box" id="p1-dice-box"></div>
      <button class="my-button roll-btn" id="p1-roll-btn" data-player="0">
        <span>TIRAR DADO</span>
      </button>
    </div>

    <!-- Exit Button at bottom left -->
    <div class="exit-button-container">
      <button class="my-button">
        <a href="../index/index.html"><span>SALIR</span></a>
      </button>
    </div>
  </aside>

  <!-- Center Area (Player Boards & Game Over Banner) -->
  <main class="game-area">
    <!-- Player 1 Board (Top) -->
    <div class="player-board" data-player="0">
      <div class="player-header">
        <span class="total-score">Total: <strong id="p1-total-score">0</strong></span>
      </div>
      <div class="player-area">
        <!-- Row 0 -->
        <button class="dice-area" data-player="0" data-column="0" data-row="0"></button>
        <button class="dice-area" data-player="0" data-column="1" data-row="0"></button>
        <button class="dice-area" data-player="0" data-column="2" data-row="0"></button>
        <!-- Row 1 -->
        <button class="dice-area" data-player="0" data-column="0" data-row="1"></button>
        <button class="dice-area" data-player="0" data-column="1" data-row="1"></button>
        <button class="dice-area" data-player="0" data-column="2" data-row="1"></button>
        <!-- Row 2 -->
        <button class="dice-area" data-player="0" data-column="0" data-row="2"></button>
        <button class="dice-area" data-player="0" data-column="1" data-row="2"></button>
        <button class="dice-area" data-player="0" data-column="2" data-row="2"></button>
      </div>
      <div class="column-scores" id="p1-column-scores">
        <div class="score-val" id="p1-col0">0</div>
        <div class="score-val" id="p1-col1">0</div>
        <div class="score-val" id="p1-col2">0</div>
      </div>
    </div>

    <!-- Game Over Banner (Hidden during gameplay) -->
    <div class="game-over-banner" id="game-over-banner" style="display: none;">
      <h2 class="winner-text" id="winner-text">¡HA GANADO JUGADOR 1!</h2>
      <button class="my-button restart-btn" id="restart-btn">
        <span>JUGAR DE NUEVO</span>
      </button>
    </div>

    <!-- Player 2 Board (Bottom) -->
    <div class="player-board" data-player="1">
      <div class="column-scores" id="p2-column-scores">
        <div class="score-val" id="p2-col0">0</div>
        <div class="score-val" id="p2-col1">0</div>
        <div class="score-val" id="p2-col2">0</div>
      </div>
      <div class="player-area">
        <!-- Row 0 -->
        <button class="dice-area" data-player="1" data-column="0" data-row="0"></button>
        <button class="dice-area" data-player="1" data-column="1" data-row="0"></button>
        <button class="dice-area" data-player="1" data-column="2" data-row="0"></button>
        <!-- Row 1 -->
        <button class="dice-area" data-player="1" data-column="0" data-row="1"></button>
        <button class="dice-area" data-player="1" data-column="1" data-row="1"></button>
        <button class="dice-area" data-player="1" data-column="2" data-row="1"></button>
        <!-- Row 2 -->
        <button class="dice-area" data-player="1" data-column="0" data-row="2"></button>
        <button class="dice-area" data-player="1" data-column="1" data-row="2"></button>
        <button class="dice-area" data-player="1" data-column="2" data-row="2"></button>
      </div>
      <div class="player-header">
        <span class="total-score">Total: <strong id="p2-total-score">0</strong></span>
      </div>
    </div>
  </main>

  <!-- Right Side Panel (Player 2 Controls & Card) -->
  <aside class="side-panel p2-side">
    <div class="player-card-box">
      <h2 class="player-title" id="p2-title">JUGADOR 2</h2>
      <div class="dice-box" id="p2-dice-box"></div>
      <button class="my-button roll-btn" id="p2-roll-btn" data-player="1">
        <span>TIRAR DADO</span>
      </button>
    </div>
  </aside>

  <!-- JavaScript Modules -->
  <script src="../../js/classes/dice.js"></script>
  <script src="../../js/classes/player.js"></script>
  <script src="../../js/utils/rules.js"></script>
  <script src="../../js/utils/status.js"></script>
  <script src="../../js/utils/3Ddice.js"></script>
  <script src="../../js/main.js"></script>
</body>

</html>
